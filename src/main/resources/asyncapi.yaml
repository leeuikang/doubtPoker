asyncapi: '2.6.0'

info:
  title: DoubtPoker WebSocket API
  version: '1.0.0'
  description: |
    거짓말 훌라(Doubt Hula) 카드 게임의 STOMP over WebSocket API.

    ## 연결 방법
    SockJS 폴백을 포함한 STOMP 클라이언트로 `/websocket` 엔드포인트에 연결합니다.

    ```js
    const socket = new SockJS('/websocket');
    const stompClient = Stomp.over(socket);
    stompClient.connect({}, () => {
      stompClient.subscribe('/topic/room/room-1', (msg) => { ... });
      stompClient.subscribe('/queue/errors', (msg) => { ... });
    });
    ```

    ## 메시지 봉투
    클라이언트 → 서버 모든 요청은 `GameMessage` 봉투로 감싸 전송합니다.

    ```json
    {
      "type": "DRAW",
      "roomId": "room-1",
      "sender": "player-1",
      "payload": { ... }
    }
    ```

    ## 턴 단계
    `DRAW` → `ACTION(MELD / EXTEND / STOP / DOUBT / REVEAL_BLUFF)` → `DISCARD`

    각 턴은 최대 **20초**이며, 시간 초과 시 자동으로 드로우 후 가장 높은 점수의 카드를 버립니다.
    버리기 직후 **5초간 땡큐 타이머**가 활성화됩니다.

servers:
  local:
    url: 'localhost:8080'
    protocol: stomp
    description: 로컬 개발 서버 (SockJS 폴백 포함)
    bindings:
      ws:
        method: GET
        query:
          type: object
        bindingVersion: '0.1.0'

defaultContentType: application/json

channels:

  # ──────────────────────────────────────────────
  # 클라이언트 → 서버 (Client Publish)
  # ──────────────────────────────────────────────

  /app/game/join:
    description: 게임 방 입장. 세션에 roomId·userName을 등록하고 방 전체에 입장 메시지를 브로드캐스트합니다.
    publish:
      operationId: joinRoom
      summary: 방 입장
      message:
        $ref: '#/components/messages/JoinMessage'

  /app/game/draw:
    description: |
      스톡 또는 버림 더미 상단에서 카드 1장을 드로우합니다.
      턴 페이즈가 DRAW일 때만 허용됩니다.
    publish:
      operationId: drawCard
      summary: 카드 드로우
      message:
        $ref: '#/components/messages/DrawMessage'

  /app/game/meld:
    description: |
      손패에서 새로운 멜드(SET / STRAIGHT / SOLO_SEVEN)를 테이블에 내려놓습니다.
      거짓말 멜드 시 actualCards와 declaredCards가 다를 수 있으며 최대 1장만 허위 가능합니다.
      거짓말 멜드 후에는 손패가 1장 이상 남아야 합니다.
    publish:
      operationId: placeMeld
      summary: 멜드 내려놓기
      message:
        $ref: '#/components/messages/MeldMessage'

  /app/game/extend:
    description: |
      테이블 위 기존 멜드에 손패 카드를 붙여 확장합니다.
      이번 턴에 멜드를 1건 이상 완성한 플레이어만 확장 가능합니다.
      확장 카드는 거짓말 불가(실제 카드 = 선언 카드).
    publish:
      operationId: extendMeld
      summary: 멜드 확장
      message:
        $ref: '#/components/messages/ExtendMessage'

  /app/game/discard:
    description: |
      손패에서 카드 1장을 버림 더미로 보냅니다.
      버리기 완료 후 5초간 땡큐 타이머가 활성화됩니다.
    publish:
      operationId: discardCard
      summary: 카드 버리기
      message:
        $ref: '#/components/messages/DiscardMessage'

  /app/game/thankYou:
    description: |
      땡큐 타이머(5초) 내에 버림 더미 상단 카드를 가져와 멜드를 실행합니다.
      동시 입력 시 버린 플레이어로부터 시계방향으로 가장 가까운 순서 우선.
      땡큐 후 해당 플레이어의 턴으로 전환됩니다(이전 플레이어 턴 건너뜀).
    publish:
      operationId: declareThankYou
      summary: 땡큐 선언
      message:
        $ref: '#/components/messages/ThankYouMessage'

  /app/game/stop:
    description: |
      핸드 점수가 턴 시작 시 10점 이하일 때 스탑을 선언합니다.
      모든 플레이어 핸드 공개 후 최저점 보유자가 승리합니다.
      스탑 선언자가 패배할 경우 본인 점수 2배 패널티 적용.
    publish:
      operationId: declareStop
      summary: 스탑 선언
      message:
        $ref: '#/components/messages/StopMessage'

  /app/game/doubt:
    description: |
      자신의 턴에 직전 멜드(lastDoubtableMeldId)를 거짓말 멜드로 지목합니다.
      성공 시: 멜드 소유자가 해당 멜드 카드 전부 회수 + 드로우 1장.
      실패 시: 지목자가 드로우 1장.
    publish:
      operationId: doubtMeld
      summary: 거짓말 지목
      message:
        $ref: '#/components/messages/DoubtMessage'

  /app/game/revealBluff:
    description: |
      자신의 턴에 본인이 낸 거짓말 멜드를 자진 공개합니다.
      해당 멜드에 확장 카드를 붙인 모든 플레이어는 드로우 1장.
      자진 공개자는 패널티 없음.
    publish:
      operationId: revealBluff
      summary: 거짓말 자진 공개
      message:
        $ref: '#/components/messages/RevealBluffMessage'

  /app/chat/message:
    description: 글로벌 채팅 메시지를 전송합니다.
    publish:
      operationId: sendChatMessage
      summary: 채팅 전송
      message:
        $ref: '#/components/messages/ChatMessageRequest'

  # ──────────────────────────────────────────────
  # 서버 → 클라이언트 (Server Subscribe)
  # ──────────────────────────────────────────────

  /topic/room/{roomId}:
    description: |
      해당 방의 모든 플레이어에게 게임 상태 변경을 브로드캐스트합니다.
      `type` 필드로 이벤트 종류를 구분합니다.
    parameters:
      roomId:
        description: 방 고유 ID
        schema:
          type: string
    subscribe:
      operationId: receiveRoomEvent
      summary: 방 이벤트 수신
      message:
        oneOf:
          - $ref: '#/components/messages/RoomEventJoin'
          - $ref: '#/components/messages/RoomEventDraw'
          - $ref: '#/components/messages/RoomEventMeld'
          - $ref: '#/components/messages/RoomEventDiscard'
          - $ref: '#/components/messages/RoomEventTurnChange'
          - $ref: '#/components/messages/RoomEventRoundEnd'
          - $ref: '#/components/messages/RoomEventDoubtResult'

  /topic/chat:
    description: 글로벌 채팅 메시지를 수신합니다.
    subscribe:
      operationId: receiveChatMessage
      summary: 채팅 수신
      message:
        $ref: '#/components/messages/ChatMessageResponse'

  /queue/errors:
    description: |
      개별 플레이어에게 에러를 전달합니다 (본인 세션에만 전송).
      예: 유효하지 않은 멜드, 존재하지 않는 방, 잘못된 턴 액션 등.
    subscribe:
      operationId: receiveError
      summary: 에러 수신
      message:
        $ref: '#/components/messages/ErrorResponse'

# ──────────────────────────────────────────────
# 컴포넌트 정의
# ──────────────────────────────────────────────

components:

  # ── 공통 스키마 ──

  schemas:

    Card:
      type: object
      description: 실제 카드 (52장 표준 덱)
      required: [suit, rank]
      properties:
        suit:
          type: string
          enum: [SPADE, HEART, DIAMOND, CLUB]
          description: "무늬 (♠ ♥ ♦ ♣)"
        rank:
          type: string
          enum: [ACE, TWO, THREE, FOUR, FIVE, SIX, SEVEN, EIGHT, NINE, TEN, JACK, QUEEN, KING]
          description: "숫자. ACE=1점, SEVEN=핸드에 남으면 14점, JACK=11, QUEEN=12, KING=13"

    DeclaredCard:
      type: object
      description: 거짓말 멜드 시 플레이어가 선언하는 카드
      required: [declaredSuit, declaredRank]
      properties:
        declaredSuit:
          type: string
          enum: [SPADE, HEART, DIAMOND, CLUB]
        declaredRank:
          type: string
          enum: [ACE, TWO, THREE, FOUR, FIVE, SIX, SEVEN, EIGHT, NINE, TEN, JACK, QUEEN, KING]

    MeldType:
      type: string
      enum: [SET, STRAIGHT, SOLO_SEVEN]
      description: |
        - SET: 같은 숫자 3~4장
        - STRAIGHT: 같은 무늬 연속 숫자 3장 이상 (A는 Q-K-A 또는 A-2-3 허용)
        - SOLO_SEVEN: 7 단독 멜드

    MeldView:
      type: object
      description: 클라이언트에 공개되는 멜드 정보 (actualCards는 서버 내부 보관)
      properties:
        id:
          type: string
        ownerId:
          type: string
        type:
          $ref: '#/components/schemas/MeldType'
        declaredCards:
          type: array
          items:
            $ref: '#/components/schemas/DeclaredCard'
        extensions:
          type: object
          description: "playerId → 붙인 선언 카드 목록"
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/DeclaredCard'
        isBluff:
          type: boolean
          description: "거짓말 지목 성공 또는 자진 공개 후에만 true로 노출"

    DrawSource:
      type: string
      enum: [STOCK, DISCARD]
      description: "STOCK: 스톡 더미, DISCARD: 버림 더미 상단"

    GameMessage:
      type: object
      description: 클라이언트 → 서버 공통 봉투
      required: [type, roomId, sender]
      properties:
        type:
          type: string
          description: GameAction 값 (DRAW / MELD / EXTEND / DISCARD / THANK_YOU / STOP / DOUBT / REVEAL_BLUFF / READY / CHAT)
        roomId:
          type: string
        sender:
          type: string
          description: 플레이어 ID
        payload:
          type: object
          description: 액션별 페이로드 (각 메시지 스키마 참조)

    RoundEndCondition:
      type: string
      enum: [GOING_OUT, STOP, STOCK_DEPLETED, BANKRUPTCY]
      description: |
        - GOING_OUT: 모든 카드 소진 (고잉아웃)
        - STOP: 스탑 선언 후 핸드 공개
        - STOCK_DEPLETED: 스톡 3회 소진
        - BANKRUPTCY: 핸드 10장 이상 즉시 탈락

    PlayerHandView:
      type: object
      description: 라운드 종료 시 공개되는 플레이어 핸드
      properties:
        playerId:
          type: string
        hand:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        handScore:
          type: integer
          description: "핸드 점수 합산 (SEVEN=14점)"

    ScoreDelta:
      type: object
      description: "playerId → 점수 변화량 (양수=획득, 음수=차감)"
      additionalProperties:
        type: integer

  # ── 메시지 정의 ──

  messages:

    # 클라이언트 → 서버

    JoinMessage:
      name: JoinMessage
      title: 방 입장 메시지
      payload:
        allOf:
          - $ref: '#/components/schemas/GameMessage'
          - type: object
            properties:
              type:
                type: string
                enum: [READY]
              payload:
                type: object
                nullable: true
      examples:
        - payload:
            type: READY
            roomId: room-1
            sender: player-1
            payload: null

    DrawMessage:
      name: DrawMessage
      title: 드로우 요청
      payload:
        allOf:
          - $ref: '#/components/schemas/GameMessage'
          - type: object
            properties:
              type:
                type: string
                enum: [DRAW]
              payload:
                type: object
                required: [source]
                properties:
                  source:
                    $ref: '#/components/schemas/DrawSource'
      examples:
        - name: 스톡에서 드로우
          payload:
            type: DRAW
            roomId: room-1
            sender: player-1
            payload:
              source: STOCK
        - name: 버림 더미에서 드로우
          payload:
            type: DRAW
            roomId: room-1
            sender: player-1
            payload:
              source: DISCARD

    MeldMessage:
      name: MeldMessage
      title: 멜드 내려놓기 요청
      payload:
        allOf:
          - $ref: '#/components/schemas/GameMessage'
          - type: object
            properties:
              type:
                type: string
                enum: [MELD]
              payload:
                type: object
                required: [actualCards, declaredCards, type]
                properties:
                  actualCards:
                    type: array
                    items:
                      $ref: '#/components/schemas/Card'
                  declaredCards:
                    type: array
                    description: 거짓말 없으면 actualCards와 동일
                    items:
                      $ref: '#/components/schemas/DeclaredCard'
                  type:
                    $ref: '#/components/schemas/MeldType'
      examples:
        - name: 정직한 SET 멜드
          payload:
            type: MELD
            roomId: room-1
            sender: player-1
            payload:
              type: SET
              actualCards:
                - { suit: SPADE, rank: NINE }
                - { suit: CLUB, rank: NINE }
                - { suit: DIAMOND, rank: NINE }
              declaredCards:
                - { declaredSuit: SPADE, declaredRank: NINE }
                - { declaredSuit: CLUB, declaredRank: NINE }
                - { declaredSuit: DIAMOND, declaredRank: NINE }
        - name: 거짓말 STRAIGHT 멜드 (J♦를 J♠로 속임)
          payload:
            type: MELD
            roomId: room-1
            sender: player-1
            payload:
              type: STRAIGHT
              actualCards:
                - { suit: SPADE, rank: NINE }
                - { suit: SPADE, rank: TEN }
                - { suit: DIAMOND, rank: JACK }
              declaredCards:
                - { declaredSuit: SPADE, declaredRank: NINE }
                - { declaredSuit: SPADE, declaredRank: TEN }
                - { declaredSuit: SPADE, declaredRank: JACK }

    ExtendMessage:
      name: ExtendMessage
      title: 멜드 확장 요청
      payload:
        allOf:
          - $ref: '#/components/schemas/GameMessage'
          - type: object
            properties:
              type:
                type: string
                enum: [EXTEND]
              payload:
                type: object
                required: [meldId, actualCards, declaredCards]
                properties:
                  meldId:
                    type: string
                    description: 확장할 테이블 위 멜드 ID
                  actualCards:
                    type: array
                    items:
                      $ref: '#/components/schemas/Card'
                  declaredCards:
                    type: array
                    description: 확장 카드는 거짓말 불가 (actual과 동일해야 함)
                    items:
                      $ref: '#/components/schemas/DeclaredCard'
      examples:
        - payload:
            type: EXTEND
            roomId: room-1
            sender: player-1
            payload:
              meldId: meld-abc123
              actualCards:
                - { suit: SPADE, rank: EIGHT }
              declaredCards:
                - { declaredSuit: SPADE, declaredRank: EIGHT }

    DiscardMessage:
      name: DiscardMessage
      title: 카드 버리기 요청
      payload:
        allOf:
          - $ref: '#/components/schemas/GameMessage'
          - type: object
            properties:
              type:
                type: string
                enum: [DISCARD]
              payload:
                type: object
                required: [card]
                properties:
                  card:
                    $ref: '#/components/schemas/Card'
      examples:
        - payload:
            type: DISCARD
            roomId: room-1
            sender: player-1
            payload:
              card: { suit: HEART, rank: KING }

    ThankYouMessage:
      name: ThankYouMessage
      title: 땡큐 선언
      payload:
        allOf:
          - $ref: '#/components/schemas/GameMessage'
          - type: object
            properties:
              type:
                type: string
                enum: [THANK_YOU]
              payload:
                type: object
                nullable: true
      examples:
        - payload:
            type: THANK_YOU
            roomId: room-1
            sender: player-2
            payload: null

    StopMessage:
      name: StopMessage
      title: 스탑 선언
      payload:
        allOf:
          - $ref: '#/components/schemas/GameMessage'
          - type: object
            properties:
              type:
                type: string
                enum: [STOP]
              payload:
                type: object
                nullable: true
      examples:
        - payload:
            type: STOP
            roomId: room-1
            sender: player-1
            payload: null

    DoubtMessage:
      name: DoubtMessage
      title: 거짓말 지목
      payload:
        allOf:
          - $ref: '#/components/schemas/GameMessage'
          - type: object
            properties:
              type:
                type: string
                enum: [DOUBT]
              payload:
                type: object
                required: [meldId]
                properties:
                  meldId:
                    type: string
                    description: 지목할 멜드 ID (lastDoubtableMeldId와 일치해야 함)
      examples:
        - payload:
            type: DOUBT
            roomId: room-1
            sender: player-2
            payload:
              meldId: meld-abc123

    RevealBluffMessage:
      name: RevealBluffMessage
      title: 거짓말 자진 공개
      payload:
        allOf:
          - $ref: '#/components/schemas/GameMessage'
          - type: object
            properties:
              type:
                type: string
                enum: [REVEAL_BLUFF]
              payload:
                type: object
                required: [meldId]
                properties:
                  meldId:
                    type: string
                    description: 공개할 본인 거짓말 멜드 ID
      examples:
        - payload:
            type: REVEAL_BLUFF
            roomId: room-1
            sender: player-1
            payload:
              meldId: meld-abc123

    ChatMessageRequest:
      name: ChatMessageRequest
      title: 채팅 전송
      payload:
        type: object
        required: [roomId, sender, message]
        properties:
          roomId:
            type: string
          sender:
            type: string
          message:
            type: string
          type:
            type: string
            enum: [ENTER, TALK, LEAVE]
      examples:
        - payload:
            roomId: room-1
            sender: player-1
            message: "안녕하세요!"
            type: TALK

    # 서버 → 클라이언트

    RoomEventJoin:
      name: RoomEventJoin
      title: 플레이어 입장 이벤트
      payload:
        type: object
        properties:
          type:
            type: string
            enum: [JOIN]
          roomId:
            type: string
          sender:
            type: string
          payload:
            type: object
            properties:
              playerId:
                type: string
              playerCount:
                type: integer

    RoomEventDraw:
      name: RoomEventDraw
      title: 드로우 완료 이벤트
      payload:
        type: object
        properties:
          type:
            type: string
            enum: [DRAW]
          roomId:
            type: string
          sender:
            type: string
            description: 드로우한 플레이어 ID
          payload:
            type: object
            properties:
              source:
                $ref: '#/components/schemas/DrawSource'
              drawnCard:
                description: 본인에게만 실제 카드 전달 (타인에게는 null)
                allOf:
                  - $ref: '#/components/schemas/Card'
                nullable: true
              handSize:
                type: integer
                description: 드로우 후 해당 플레이어 손패 수

    RoomEventMeld:
      name: RoomEventMeld
      title: 멜드 / 확장 이벤트
      payload:
        type: object
        properties:
          type:
            type: string
            enum: [MELD, EXTEND]
          roomId:
            type: string
          sender:
            type: string
          payload:
            type: object
            properties:
              meld:
                $ref: '#/components/schemas/MeldView'
              handSize:
                type: integer

    RoomEventDiscard:
      name: RoomEventDiscard
      title: 버리기 완료 / 땡큐 타이머 시작 이벤트
      payload:
        type: object
        properties:
          type:
            type: string
            enum: [DISCARD]
          roomId:
            type: string
          sender:
            type: string
          payload:
            type: object
            properties:
              discardedCard:
                $ref: '#/components/schemas/Card'
              thankYouTimerSec:
                type: integer
